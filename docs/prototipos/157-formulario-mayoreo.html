:root{
  --cobalto:#063995; --cobalto-hondo:#001c4e; --cobalto-velo:rgba(6,57,149,.06);
  --esmalte:#fefefe; --loza:#f7f5f4;
  --grafito:#1f1919; --acero:#424242; --humo:#7a7a7a;
  --linea:rgba(66,66,66,.2); --pelo:rgba(66,66,66,.09);
  --error:#b42318; --error-velo:#fdf1f0;
  --radio:3px;
  --sans:'Montserrat',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--loza);color:var(--acero);font:400 15px/1.6 var(--sans);min-height:100vh;padding-bottom:40px}
:focus-visible{outline:2px solid var(--cobalto);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.cascaron{max-width:560px;margin:0 auto;padding:34px 16px 20px}
.tarjeta{background:var(--esmalte);border:1px solid var(--pelo);border-top:4px solid var(--cobalto);border-radius:var(--radio);padding:30px 26px 26px;box-shadow:0 1px 2px rgba(31,25,25,.04)}
.ceja{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--cobalto);margin-bottom:10px}
.titulo{font-size:21px;line-height:1.4;font-weight:500;color:var(--grafito);text-wrap:balance;margin-bottom:26px}
form{display:flex;flex-direction:column;gap:18px}

/* respiro entre grupos semanticos: espacio, sin rotulo */
.respiro{margin-top:14px}

.campo{display:flex;flex-direction:column;gap:5px}
.campo>label,.rotulo{font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--grafito)}
.req{color:var(--error);font-weight:500}
.campo label .op,.rotulo .op{font-weight:400;text-transform:none;letter-spacing:0;color:var(--humo)}
.campo input,.campo select{font:400 16px/1.4 var(--sans);color:var(--grafito);background:var(--esmalte);border:1px solid var(--linea);border-radius:var(--radio);padding:11px 12px;width:100%}
.campo input::placeholder{color:#b5b0ae}
.campo input:focus,.campo select:focus{border-color:var(--cobalto);outline:none;box-shadow:0 0 0 3px var(--cobalto-velo)}
.campo.mal input,.campo.mal select{border-color:var(--error);background:var(--error-velo)}
.aviso-mal{display:none;font-size:12.5px;color:var(--error)}
.campo.mal .aviso-mal{display:block}
.pista{font-size:12.5px;color:var(--humo)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fila-cel{display:grid;grid-template-columns:104px 1fr;gap:8px}
@media(max-width:380px){.fila2{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.chips input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.chips label{display:inline-flex;align-items:center;font-size:13px;font-weight:500;line-height:1;color:var(--acero);background:var(--esmalte);border:1px solid var(--linea);border-radius:999px;padding:8px 14px;cursor:pointer;user-select:none;white-space:nowrap}
.chips input:checked+label{background:var(--cobalto);border-color:var(--cobalto);color:#fff}
.chips input:focus-visible+label{outline:2px solid var(--cobalto);outline-offset:2px}
.campo.mal .chips label{border-color:var(--error)}

.cp-ok{display:none;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--cobalto);background:var(--cobalto-velo);border-radius:var(--radio);padding:7px 10px}
.cp-ok.ver{display:inline-flex}
.sug-correo{display:none;font-size:13px;color:var(--acero)}
.sug-correo.ver{display:block}
.sug-correo button{font:500 13px var(--sans);color:var(--cobalto);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}

.btn{display:block;width:100%;font:500 13.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--cobalto);border:none;border-radius:var(--radio);padding:16px 20px;cursor:pointer;box-shadow:inset 0 -3px 0 var(--cobalto-hondo)}
.btn:hover{background:var(--cobalto-hondo)}

.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--acero);cursor:pointer;user-select:none}
.consent input{width:16px;height:16px;margin-top:2px;accent-color:var(--cobalto);flex:none}
.aviso-priv{font-size:11.5px;color:var(--humo);text-align:center}
.aviso-priv a{color:var(--cobalto)}
.turnstile{display:flex;align-items:center;gap:10px;border:1px dashed var(--linea);border-radius:var(--radio);padding:12px 14px;font-size:12.5px;color:var(--humo);background:var(--esmalte)}
.nota-spam{font-size:12.5px;color:var(--humo);border-top:1px solid var(--pelo);padding-top:14px}
.pie-datos{font-size:11px;color:#a29d9b;text-align:center;margin-top:18px}
.pie-datos a{color:inherit}

.exito{display:none;text-align:center;padding:46px 26px}
.exito.ver{display:block}
.exito .aro{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;border:3px solid var(--cobalto);display:flex;align-items:center;justify-content:center;color:var(--cobalto)}
.exito h3{font-size:21px;font-weight:500;color:var(--grafito);margin-bottom:8px;text-wrap:balance}
.exito p{max-width:34ch;margin:0 auto 6px}
.exito .nota-spam{margin-top:18px;text-align:left}
</style>

<section class="cascaron">
  <div class="tarjeta">
    <div class="ceja">Peltre de mayoreo</div>
    <h2 class="titulo">D&eacute;janos tus datos y nuestro equipo se pondr&aacute; en contacto contigo.</h2>
    <form novalidate></form>
    <div class="exito"></div>
  </div>
  <p class="pie-datos">pp.peltre &middot; Peltre Nacional &middot; datos de c&oacute;digo postal: <a href="https://www.geonames.org" target="_blank" rel="noopener">GeoNames</a> (CC BY 4.0)</p>
</section>

<script>
var CP_MOCK={
  MX:{'56530':['Ixtapaluca','Estado de México'],'06700':['Cuauhtémoc','Ciudad de México'],'44100':['Guadalajara','Jalisco'],'64000':['Monterrey','Nuevo León'],'97000':['Mérida','Yucatán'],'72000':['Puebla','Puebla']},
  US:{'90210':['Beverly Hills','CA'],'10001':['New York','NY']},
  CA:{'M5V':['Toronto','ON']}
};
var DOMINIOS=['gmail.com','hotmail.com','outlook.com','yahoo.com','yahoo.com.mx','icloud.com','prodigy.net.mx','live.com.mx'];
var TIPOS=['Distribuidores','Menudistas','Restaurantes','Hoteles','Cafeterías','Catering | Eventos','Agencias | Marcas','Otro'];
var CANTS=['+100','+350','+550','+1,500'];
var CUANDO=['En las próximas 4 semanas','En los próximos 3 meses','En los próximos 6 meses','Aún no tengo fecha'];
var p='f_';
var AST='<span class="req">*</span>';

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;var m=[],i,j;for(i=0;i<=a.length;i++)m[i]=[i];for(j=0;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}

function campo(id,rot,inner,pista,extra){
  return '<div class="campo'+(extra||'')+'" data-campo="'+id+'"><label for="'+id+'">'+rot+'</label>'+inner+(pista?'<span class="pista">'+pista+'</span>':'')+'<span class="aviso-mal" data-mal></span></div>';
}

var form=document.querySelector('form');
form.innerHTML=
  /* --- el proyecto --- */
  campo(p+'tipo','¿Qué tipo de proyecto tienes en mente? '+AST,
    '<select id="'+p+'tipo" required><option value="" selected disabled>Selecciona una opción</option>'+TIPOS.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select>')+
  '<div class="campo" data-campo="'+p+'otro" style="display:none"><label for="'+p+'otro">¿Cuál? '+AST+'</label><input id="'+p+'otro" placeholder="Cuéntanos en pocas palabras"><span class="aviso-mal" data-mal></span></div>'+
  campo(p+'empresa','Nombre de la empresa o proyecto <span class="op">(opcional)</span>','<input id="'+p+'empresa" autocomplete="organization">')+
  '<div class="campo" data-campo="'+p+'cant"><span class="rotulo">¿Qué cantidad estás considerando? '+AST+'</span><div class="chips">'+
    CANTS.map(function(c,i){return '<input type="radio" name="'+p+'cant" id="'+p+'cant'+i+'" value="'+c+' piezas"><label for="'+p+'cant'+i+'">'+c+' piezas</label>';}).join('')+
  '</div><span class="pista">Por ejemplo: si necesitas 150 piezas, elige +100.</span><span class="aviso-mal" data-mal></span></div>'+
  campo(p+'cp','Código postal '+AST,'<input id="'+p+'cp" inputmode="numeric" autocomplete="postal-code" maxlength="7" required>','Para calcular tu envío desde la fábrica.')+
  '<div class="cp-ok" data-cpok><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg><span></span></div>'+
  '<div class="campo" data-campo="'+p+'ciudad" style="display:none"><label for="'+p+'ciudad">Ciudad '+AST+'</label><input id="'+p+'ciudad" autocomplete="address-level2"><span class="pista">No encontramos ese código postal &mdash; escribe tu ciudad.</span><span class="aviso-mal" data-mal></span></div>'+
  '<div class="campo" data-campo="'+p+'cuando"><span class="rotulo">¿Para cuándo lo necesitas? <span class="op">(opcional)</span></span><div class="chips">'+
    CUANDO.map(function(c,i){return '<input type="radio" name="'+p+'cuando" id="'+p+'cuando'+i+'" value="'+c+'"><label for="'+p+'cuando'+i+'">'+c+'</label>';}).join('')+
  '</div></div>'+
  /* --- la persona --- */
  '<div class="fila2 respiro">'+
    campo(p+'nombre','Nombre '+AST,'<input id="'+p+'nombre" autocomplete="given-name" required>')+
    campo(p+'apellido','Apellido '+AST,'<input id="'+p+'apellido" autocomplete="family-name" required>')+
  '</div>'+
  campo(p+'cargo','Tu cargo en el proyecto <span class="op">(opcional)</span>','<input id="'+p+'cargo" autocomplete="organization-title" placeholder="Compras, dueño, chef...">')+
  /* --- contacto --- */
  campo(p+'cel','Celular '+AST,'<div class="fila-cel"><select id="'+p+'pais" aria-label="Código de país"><option value="MX" selected>MX +52</option><option value="US">US +1</option><option value="CA">CA +1</option></select><input id="'+p+'cel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="10 dígitos" required></div>','Te escribimos por WhatsApp.')+
  campo(p+'correo','Correo electrónico <span class="op">(opcional)</span>','<input id="'+p+'correo" type="email" autocomplete="email">')+
  '<div class="sug-correo" data-sug><span></span> <button type="button" data-acepta-sug>Corregir</button></div>'+
  campo(p+'web','Sitio web o redes sociales <span class="op">(opcional)</span>','<input id="'+p+'web" inputmode="url" placeholder="@tumarca o tusitio.mx">','', ' respiro')+
  '<label class="consent"><input type="checkbox" id="'+p+'promos"> Quiero recibir novedades y promociones de pp.peltre <span class="op">(opcional)</span></label>'+
  '<div class="turnstile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Verificación anti-robots (Cloudflare Turnstile) &mdash; se activa en producción</div>'+
  '<button type="submit" class="btn">Enviar mis datos</button>'+
  '<p class="aviso-priv">Al enviar aceptas nuestro <a href="https://pppeltre.mx/policies/privacy-policy" target="_blank" rel="noopener">Aviso de Privacidad</a>.</p>'+
  '<p class="nota-spam">No olvides revisar tu bandeja de correo no deseado y agregar <strong>contacto@pppeltre.mx</strong> a tu lista de contactos seguros.</p>';

document.querySelector('.exito').innerHTML='<div class="aro"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div><h3>&iexcl;Gracias! Recibimos tus datos.</h3><p>Nuestro equipo se pondrá en contacto contigo por WhatsApp en horas hábiles.</p><p class="nota-spam">No olvides revisar tu bandeja de correo no deseado y agregar <strong>contacto@pppeltre.mx</strong> a tu lista de contactos seguros.</p>';

function q(id){return form.querySelector('#'+p+id);}
function wrap(id){return form.querySelector('[data-campo="'+p+id+'"]');}
function marca(id,msg){var w=wrap(id);if(!w)return;var m=w.querySelector('[data-mal]');if(msg){w.classList.add('mal');if(m)m.textContent=msg;}else{w.classList.remove('mal');}}

var cp=q('cp'),cpok=form.querySelector('[data-cpok]'),wCiudad=wrap('ciudad');
function resolverCP(){
  var pais=q('pais')?q('pais').value:'MX';
  var v=(cp.value||'').trim().toUpperCase();var llave=pais==='CA'?v.slice(0,3):v;
  var hit=(CP_MOCK[pais]||{})[llave];
  if(hit){cpok.querySelector('span').textContent=hit[0]+', '+hit[1];cpok.classList.add('ver');wCiudad.style.display='none';marca('cp',null);}
  else{cpok.classList.remove('ver');if(v.length>=(pais==='CA'?3:5)){wCiudad.style.display='flex';}}
}
cp.addEventListener('input',resolverCP);
q('pais').addEventListener('change',resolverCP);

var correo=q('correo'),sug=form.querySelector('[data-sug]'),sugerido='';
correo.addEventListener('blur',function(){
  var v=correo.value.trim(),at=v.indexOf('@');sug.classList.remove('ver');
  if(at<1)return;var dom=v.slice(at+1).toLowerCase();if(DOMINIOS.indexOf(dom)>=0)return;
  for(var i=0;i<DOMINIOS.length;i++){if(lev(dom,DOMINIOS[i])<=2){sugerido=v.slice(0,at+1)+DOMINIOS[i];sug.querySelector('span').textContent='¿Quisiste decir '+DOMINIOS[i]+'?';sug.classList.add('ver');break;}}
});
form.querySelector('[data-acepta-sug]').addEventListener('click',function(){correo.value=sugerido;sug.classList.remove('ver');});

var wOtro=wrap('otro');
form.addEventListener('change',function(e){
  if(e.target.id===p+'tipo'){wOtro.style.display=q('tipo').value==='Otro'?'flex':'none';marca('tipo',null);}
  if(e.target.name===p+'cant')marca('cant',null);
});

form.addEventListener('submit',function(e){
  e.preventDefault();
  var mal=[];
  function req(id,msg,cond){var ok=cond!==undefined?cond:(q(id)&&q(id).value.trim());marca(id,ok?null:msg);if(!ok)mal.push(id);}
  req('tipo','Selecciona una opción.',!!q('tipo').value);
  if(q('tipo').value==='Otro')req('otro','Cuéntanos qué tienes en mente.');
  req('cant','Selecciona una cantidad.',!!form.querySelector('input[name="'+p+'cant"]:checked'));
  req('cp','Escribe tu código postal.',(cp.value.trim().length>=3)&&(cpok.classList.contains('ver')||q('ciudad').value.trim()));
  if(wCiudad.style.display!=='none'&&!q('ciudad').value.trim()&&cp.value.trim())marca('ciudad','Escribe tu ciudad.');
  req('nombre','Escribe tu nombre.');
  req('apellido','Escribe tu apellido.');
  req('cel','Escribe tu celular a 10 dígitos.',q('cel').value.replace(/\D/g,'').length>=10);
  var cv=correo.value.trim();
  req('correo','Ese correo no se ve válido.',!cv||/.+@.+\..+/.test(cv));
  if(mal.length){var w=wrap(mal[0]);if(w)w.scrollIntoView({block:'center',behavior:'smooth'});return;}
  form.style.display='none';document.querySelector('.exito').classList.add('ver');
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
