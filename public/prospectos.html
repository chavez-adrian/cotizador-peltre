<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Prospectos - Cotizador Peltre Nacional</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .leads-container { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .leads-barra { background: var(--white); border-radius: var(--radius); padding: 12px;
    margin-bottom: 12px; border: 1px solid var(--border); }
  .leads-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .leads-filtro { display: flex; flex-direction: column; gap: 4px; flex: 1 1 150px; min-width: 0; }
  .leads-filtro label { font-size: 11px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.04em; }
  .leads-filtro select, .leads-filtro input { padding: 7px 10px; border: 1px solid var(--border);
    border-radius: var(--radius-input); font-size: 13px; font-family: inherit; min-width: 0; }
  .leads-titulo { font-size: 15px; font-weight: 600; color: var(--primary-dark); margin: 0 0 10px; }
  .leads-resumen { font-size: 13px; color: var(--text-muted); margin-top: 10px; }
  .leads-resumen strong { color: var(--primary-dark); }

  /* La tabla scrollea dentro de su tarjeta, nunca el documento (#286). */
  .leads-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); }
  table.leads { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.leads th, table.leads td { padding: 8px 10px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--border); }
  table.leads th { background: var(--bg); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--text-muted); cursor: pointer; user-select: none;
    position: sticky; top: 0; }
  table.leads th .orden-flecha { color: var(--primary); }
  table.leads tbody tr.fila-lead { cursor: pointer; }
  table.leads tbody tr.fila-lead:hover { background: var(--bg); }
  /* El limite de ancho va en un elemento INTERNO, no en la celda: max-width
     sobre un <td> no se respeta con table-layout automatico (la columna se
     dimensiona por su contenido mas largo) y el texto se derramaba encima de la
     celda vecina. El texto completo queda en la fila de detalle.
     El tope por viewport es para el telefono: con el ancho de escritorio, la
     primera columna ya no cabria junto al boton anclado y el nombre quedaria
     cortado desde el arranque. */
  td .recorte { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: min(var(--ancho), 42vw); }

  .estado-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px;
    font-weight: 600; white-space: nowrap; }
  .estado-sin_contactar { background: oklch(0.94 0.05 30); color: oklch(0.45 0.15 30); }
  .estado-contactado { background: oklch(0.95 0.04 80); color: oklch(0.45 0.12 70); }
  .estado-agendado { background: oklch(0.94 0.05 240); color: oklch(0.45 0.14 250); }
  .estado-cotizado { background: oklch(0.93 0.06 150); color: oklch(0.40 0.13 155); }
  .estado-cliente { background: oklch(0.93 0.05 300); color: oklch(0.42 0.14 300); }

  .btn-wa, .btn-contacte, .btn-operam { display: inline-block; padding: 5px 12px;
    border-radius: var(--radius-input); color: var(--white); font-size: 12px; font-weight: 600;
    text-decoration: none; white-space: nowrap; border: none; font-family: inherit; }
  .btn-wa { background: oklch(0.62 0.16 150); }
  .btn-contacte { background: var(--primary); cursor: pointer; }
  .btn-operam { background: var(--text-muted); }
  .btn-wa.deshabilitado { background: var(--border); color: var(--text-muted); pointer-events: none; }

  /* La columna de acciones va anclada a la derecha: son las acciones de la
     pantalla y en el telefono la tabla no cabe, asi que sin esto habria que
     arrastrarla hasta el final para alcanzar los botones. Fondo opaco propio
     porque queda encima de las demas celdas al scrollear. */
  table.leads th:last-child, table.leads tr.fila-lead > td:last-child {
    position: sticky; right: 0; background: var(--white);
    box-shadow: -6px 0 8px -6px oklch(0 0 0 / 0.18); }
  table.leads th:last-child { background: var(--bg); }
  table.leads tbody tr.fila-lead:hover > td:last-child { background: var(--bg); }

  /* La fila de detalle se ancla a la izquierda y se mide contra la PANTALLA, no
     contra la tabla: la tabla es mas ancha que el telefono, asi que un detalle
     que herede su ancho se sale de la vista y hay que arrastrarlo para leerlo. */
  tr.detalle-lead td { background: var(--bg); white-space: normal; font-size: 12.5px;
    line-height: 1.7; position: sticky; left: 0; }
  tr.detalle-lead dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0;
    width: calc(100vw - 60px); max-width: 820px; overflow-wrap: anywhere; }
  tr.detalle-lead dt { color: var(--text-muted); }
  tr.detalle-lead dd { margin: 0; }
  .aviso-vacio { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .sub-fila, .txt-corto { display: none; }

  /* En el telefono la tabla completa no cabe, y con scroll horizontal el boton
     anclado se monta encima de la columna de al lado. En vez de pelearse con el
     ancho, la pantalla angosta muestra SOLO las tres columnas que importan para
     escribir -- estado, a quien, y el boton -- con la empresa debajo del nombre.
     Lo demas se lee tocando la fila. */
  @media (max-width: 560px) {
    table.leads th:nth-child(n+3):not(:last-child),
    table.leads tr.fila-lead > td:nth-child(n+3):not(:last-child) { display: none; }
    .sub-fila { display: block; font-size: 11px; color: var(--text-muted); }
    .txt-largo { display: none; }
    .txt-corto { display: inline; }
    table.leads th, table.leads td { padding: 8px 6px; }
    td .recorte { max-width: 40vw; }
  }
</style>
</head>
<body>

<div id="leads-login" class="login-container" style="display:none">
  <div class="login-card">
    <h1>Prospectos</h1>
    <p class="subtitle">Entra con tu PIN de vendedor</p>
    <div class="form-group">
      <label>Vendedor</label>
      <select id="login-vendedor"></select>
    </div>
    <div class="form-group">
      <label>PIN</label>
      <input type="password" id="login-pin" maxlength="4" inputmode="numeric">
    </div>
    <div id="login-error" class="alert alert-error" style="display:none"></div>
    <button class="btn btn-primary btn-block" id="login-btn">Entrar</button>
  </div>
</div>

<div id="leads-app" class="leads-container" style="display:none">
  <h2 class="leads-titulo" id="leads-titulo">Prospectos</h2>
  <div class="leads-barra">
    <div class="leads-filtros">
      <div class="leads-filtro">
        <label for="f-evento">Evento</label>
        <select id="f-evento"></select>
      </div>
      <div class="leads-filtro">
        <label for="f-origen">Origen</label>
        <select id="f-origen"></select>
      </div>
      <div class="leads-filtro">
        <label for="f-vendedor">Vendedor</label>
        <select id="f-vendedor"></select>
      </div>
      <div class="leads-filtro">
        <label for="f-tipo">Tipo de cliente</label>
        <select id="f-tipo"></select>
      </div>
      <div class="leads-filtro">
        <label for="f-area">Área de interés</label>
        <select id="f-area"></select>
      </div>
      <div class="leads-filtro">
        <label for="f-gafete">Gafete</label>
        <select id="f-gafete"></select>
      </div>
      <div class="leads-filtro">
        <label for="f-estado">Estado</label>
        <select id="f-estado"></select>
      </div>
      <div class="leads-filtro">
        <label for="f-pendientes">Pendientes</label>
        <select id="f-pendientes">
          <option value="">Todos</option>
          <option value="con">Con pendientes</option>
          <option value="sin">Sin pendientes</option>
        </select>
      </div>
      <div class="leads-filtro">
        <label for="f-texto">Buscar</label>
        <input type="search" id="f-texto" placeholder="nombre, empresa, ciudad">
      </div>
    </div>
    <div class="leads-resumen" id="leads-resumen"></div>
  </div>

  <div class="leads-scroll">
    <table class="leads">
      <thead><tr id="leads-cabeceras"></tr></thead>
      <tbody id="leads-cuerpo"></tbody>
    </table>
    <div class="aviso-vacio" id="leads-vacio" style="display:none">
      Ningún prospecto coincide con los filtros.
    </div>
  </div>
</div>

<script type="module">
import { buildWaLinkProspecto, CANALES } from '/js/prospectos-logica.js';

// Tabla de prospectos. Lee GET /api/prospectos/tabla, que ya resuelve la
// visibilidad -- un vendedor ve los suyos y el admin ve todos (por eso el
// filtro de vendedor solo aparece cuando de verdad hay mas de uno a la vista) --
// y ademas los campos derivados: la pantalla NO calcula el Estado del prospecto.
// Comparte el token de localStorage con la app principal: quien ya entro al
// cotizador en este navegador no vuelve a teclear el PIN.
// La etiqueta corta es para el telefono: la larga se come el ancho que necesita
// el nombre y lo empuja debajo de los botones anclados. El rango es el orden de
// la escalera del glosario, no el alfabetico. Los escalones que faltan se
// AGREGAN aqui: la tabla no conoce ningun estado que no este en este objeto.
const ESTADOS = {
  sin_contactar: { etiqueta: 'Sin contactar', corta: 'Sin contactar', rango: 0 },
  contactado: { etiqueta: 'Contactado', corta: 'Contactado', rango: 1 },
  agendado: { etiqueta: 'Agendado', corta: 'Agendado', rango: 2 },
  cotizado: { etiqueta: 'Cotizado', corta: 'Cotizado', rango: 3 },
  cliente: { etiqueta: 'Ya es cliente', corta: 'Cliente', rango: 4 },
};
// #316: el rango es el orden de CONTEXT.md "Gafete" (RANGO_GAFETE de
// lib/tabla-prospectos.js), no el alfabetico -- los de solo gafete quedan
// arriba porque son los unicos sin siguiente paso acordado. La pagina no
// importa del nucleo (cross-import server<->public/js es para modulos
// compartidos, no para una copia local de un arreglo de tres literales).
const RANGO_GAFETE = ['solo_gafete', 'gafete_y_stand', 'sin_gafete'];
const GAFETES = {
  solo_gafete: 'Solo gafete',
  gafete_y_stand: 'Gafete + stand',
  sin_gafete: 'Sin gafete',
};
// Las cuatro llaves de LLAVES_QUE_FALTA desde hoy (#321), aunque el servidor
// hoy solo emita 'calificacion' y 'correo': asi #322 no toca esta pagina.
const ETIQUETAS_QUE_FALTA = {
  calificacion: 'Calificación pendiente',
  correo: 'Sin correo',
  datos_fiscales: 'Datos fiscales',
  domicilio: 'Domicilio de entrega',
};

const COLUMNAS = [
  { llave: 'estado', titulo: 'Estado', valor: p => ESTADOS[p.estado].rango,
    texto: p => ESTADOS[p.estado].etiqueta },
  // La empresa se repite debajo del nombre para la pantalla angosta, donde su
  // columna no se muestra (ver el media query).
  { llave: 'nombre', titulo: 'Nombre', valor: p => p.nombre || '', ancho: 180,
    sub: p => [p.data.empresa || '', p.queSigue.accion] },
  // Ordena por el ISO que manda el servidor (los vacios al final, como toda
  // celda en blanco) y se lee como fecha corta: el ano no dice nada aqui.
  { llave: 'ultimoContacto', titulo: 'Último contacto', valor: p => p.ultimoContacto || '',
    texto: p => fechaCorta(p.ultimoContacto) },
  // #318: la unica accion en palabras de la fila. En el telefono esta columna
  // queda oculta (media query) y la accion se lee como sub-fila bajo el nombre.
  { llave: 'queSigue', titulo: 'Qué sigue', valor: p => p.queSigue.accion, ancho: 220 },
  { llave: 'empresa', titulo: 'Empresa', valor: p => p.data.empresa || '', ancho: 200 },
  { llave: 'tipo', titulo: 'Tipo', valor: p => p.data.tipo_cliente || '' },
  { llave: 'area', titulo: 'Área de interés', valor: p => p.data.area_interes || '', ancho: 240 },
  { llave: 'ciudad', titulo: 'Ciudad', valor: p => p.ciudad || '' },
  { llave: 'tamano', titulo: 'Tamaño', valor: p => p.data.tamano || '' },
  { llave: 'vendedor', titulo: 'Vendedor', valor: p => p.vendedor || '' },
  { llave: 'gafete', titulo: 'Gafete', valor: p => RANGO_GAFETE.indexOf(p.gafete),
    texto: p => GAFETES[p.gafete] },
  // Vacio (nada falta) cuenta como '' para que la regla de siempre -- lo vacio
  // al final -- lo empuje al fondo en vez de ordenarlo como un cero numerico.
  { llave: 'queFalta', titulo: 'Qué falta', valor: p => p.queFalta.length || '',
    texto: p => p.queFalta.map(k => ETIQUETAS_QUE_FALTA[k]).join(', '), ancho: 220 },
];

const estado = {
  token: localStorage.getItem('token'),
  prospectos: [],
  ligas: { catalogoUrl: '', sitioUrl: '', operamUrl: '' },
  orden: { llave: 'estado', asc: true },
  abierta: null,
};

function el(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// --- Derivados del prospecto ---

function fechaCorta(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
}

// El area de interes es multi-valor separado por punto y coma
// ("Alimentos; Cristalería - Vajillas"): el filtro es por valor suelto.
function areasDe(p) {
  return String(p.data.area_interes || '').split(';').map(a => a.trim()).filter(Boolean);
}

function prepara(p) {
  p.data = p.data || {};
  p._areas = areasDe(p);
  p._busqueda = [p.nombre, p.data.empresa, p.ciudad, p.data.puesto].filter(Boolean).join(' ').toLowerCase();
  return p;
}

// --- Filtros ---

function opciones(sel, valores, etiquetaTodos) {
  sel.innerHTML = `<option value="">${escapeHtml(etiquetaTodos)}</option>` +
    valores.map(v => `<option value="${escapeHtml(v.valor)}">${escapeHtml(v.texto)}</option>`).join('');
}

function unicos(lista) {
  return [...new Set(lista.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
}

function poblarFiltros() {
  const ps = estado.prospectos;
  opciones(el('f-evento'), unicos(ps.map(p => p.data.evento)).map(v => ({ valor: v, texto: v })), 'Todos');
  opciones(el('f-tipo'), unicos(ps.map(p => p.data.tipo_cliente)).map(v => ({ valor: v, texto: v })), 'Todos');
  opciones(el('f-area'), unicos(ps.flatMap(p => p._areas)).map(v => ({ valor: v, texto: v })), 'Todas');
  opciones(el('f-gafete'), RANGO_GAFETE.map(valor => ({ valor, texto: GAFETES[valor] })), 'Todos');
  // El Origen se ofrece completo (catalogo cerrado del glosario), no solo los
  // valores presentes: la lista es corta y estable, y asi no cambia de tamano
  // segun a quien tenga cargado el vendedor.
  opciones(el('f-origen'), CANALES.map(v => ({ valor: v, texto: v })), 'Todos');
  opciones(el('f-estado'), Object.entries(ESTADOS).map(([valor, e]) => ({ valor, texto: e.etiqueta })), 'Todos');

  const vendedores = unicos(ps.map(p => p.vendedor));
  const filtroVendedor = el('f-vendedor').closest('.leads-filtro');
  // Con un solo vendedor a la vista el filtro no decide nada: estorba.
  filtroVendedor.style.display = vendedores.length > 1 ? '' : 'none';
  opciones(el('f-vendedor'), vendedores.map(v => ({ valor: v, texto: v })), 'Todos');
}

// #317: el titulo dice de que es la tabla. Sin filtro de evento es la de todos
// los prospectos; con uno activo es la cola de esa feria, y el nombre del evento
// tiene que verse tambien en la pestana (la tabla se abre desde el telefono con
// varias pestanas del cotizador encima).
function pintaTitulo() {
  const evento = el('f-evento').value;
  el('leads-titulo').textContent = evento || 'Prospectos';
  document.title = `${evento || 'Prospectos'} - Cotizador Peltre Nacional`;
}

function filtrados() {
  const evento = el('f-evento').value;
  const vendedor = el('f-vendedor').value;
  const tipo = el('f-tipo').value;
  const area = el('f-area').value;
  const gafete = el('f-gafete').value;
  const origen = el('f-origen').value;
  const est = el('f-estado').value;
  const pendientes = el('f-pendientes').value;
  const texto = el('f-texto').value.trim().toLowerCase();
  return estado.prospectos.filter(p =>
    (!evento || p.data.evento === evento) &&
    (!vendedor || p.vendedor === vendedor) &&
    (!tipo || p.data.tipo_cliente === tipo) &&
    (!area || p._areas.includes(area)) &&
    (!gafete || p.gafete === gafete) &&
    (!origen || p.origen === origen) &&
    (!est || p.estado === est) &&
    (!pendientes || (pendientes === 'con' ? p.queFalta.length > 0 : p.queFalta.length === 0)) &&
    (!texto || p._busqueda.includes(texto)));
}

// --- Render ---

function ordena(lista) {
  const col = COLUMNAS.find(c => c.llave === estado.orden.llave);
  const signo = estado.orden.asc ? 1 : -1;
  return [...lista].sort((a, b) => {
    const va = col.valor(a), vb = col.valor(b);
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * signo;
    // Lo vacio siempre al final, ordene como ordene: una celda en blanco no es
    // informacion y no debe ganarle el lugar de arriba a una que si lo es.
    if (!va && vb) return 1;
    if (va && !vb) return -1;
    return String(va).localeCompare(String(vb), 'es') * signo;
  });
}

function pintaCabeceras() {
  el('leads-cabeceras').innerHTML = COLUMNAS.map(c => {
    const activa = estado.orden.llave === c.llave;
    const flecha = activa ? `<span class="orden-flecha">${estado.orden.asc ? '↑' : '↓'}</span>` : '';
    return `<th data-orden="${c.llave}">${escapeHtml(c.titulo)} ${flecha}</th>`;
  }).join('') + '<th>Acciones</th>';
}

// La liga de WhatsApp NO registra nada (CONTEXT.md "Toque"): abrir el chat con
// el mensaje prellenado no es un contacto, el envio ocurre en otra app. El
// toque es el tap aparte del boton Contacte.
// #323: "Ver en Operam" es complemento, no la respuesta (CONTEXT.md "Que sigue
// / Que falta") -- solo aparece con cliente ligado y con la base de Operam
// disponible, para consultar en la web legacy lo que la tabla no modela.
function celdaAcciones(p) {
  const liga = buildWaLinkProspecto(p, estado.ligas);
  const wa = liga
    ? `<a class="btn-wa" href="${escapeHtml(liga)}" target="_blank" rel="noopener">WhatsApp</a>`
    : '<span class="btn-wa deshabilitado">Sin celular</span>';
  const operam = (p.clienteId != null && estado.ligas.operamUrl)
    ? ` <a class="btn-operam" href="${escapeHtml(estado.ligas.operamUrl)}/sales/manage/customers.php?debtor_no=${escapeHtml(p.clienteId)}" target="_blank" rel="noopener">Ver en Operam</a>`
    : '';
  return `${wa}${operam} <button type="button" class="btn-contacte" data-toque="${escapeHtml(p.id)}">Contacté</button>`;
}

function filaDetalle(p) {
  const cal = p.data.calificacion || {};
  const filas = [
    // Empresa y area de interes se recortan en la tabla: aqui van completas.
    ['Empresa', p.data.empresa],
    ['Área de interés', p.data.area_interes],
    ['Celular', p.celular],
    ['Correo', p.data.correo],
    ['Puesto', p.data.puesto],
    ['Decisión de compra', p.data.decision],
    ['Años operando', cal.anios],
    ['Sucursales', cal.sucursales],
    ['Usa peltre', cal.usa_peltre === undefined ? '' : (cal.usa_peltre ? `Sí${cal.proveedor_peltre ? ' - ' + cal.proveedor_peltre : ''}` : 'No')],
    ['Valora', (cal.valora || []).join(', ')],
    ['Concepto', cal.concepto],
    ['Piezas estimadas', p.data.piezas_estimadas],
    ['Gafete', GAFETES[p.gafete]],
    ['Cliente en Operam', p.clienteId],
    ['Qué falta', p.queFalta.map(k => ETIQUETAS_QUE_FALTA[k]).join(', ')],
    ['Notas', p.data.notas],
  ].filter(([, v]) => v !== undefined && v !== null && v !== '');
  const dl = filas.map(([k, v]) =>
    `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v).replace(/\n/g, '<br>')}</dd>`).join('');
  return `<tr class="detalle-lead"><td colspan="${COLUMNAS.length + 1}"><dl>${dl}</dl></td></tr>`;
}

function pinta() {
  pintaTitulo();
  const lista = ordena(filtrados());
  pintaCabeceras();
  el('leads-cuerpo').innerHTML = lista.map(p => {
    const celdas = COLUMNAS.map(c => {
      const texto = String(c.texto ? c.texto(p) : c.valor(p));
      if (c.llave === 'estado') {
        const corta = ESTADOS[p.estado].corta;
        return `<td><span class="estado-badge estado-${escapeHtml(p.estado)}">` +
          `<span class="txt-largo">${escapeHtml(texto)}</span>` +
          `<span class="txt-corto">${escapeHtml(corta)}</span></span></td>`;
      }
      if (!c.ancho) return `<td>${escapeHtml(texto)}</td>`;
      // Varias sub-filas por columna: en el telefono el nombre carga la empresa
      // y la accion de Que sigue, cuyas columnas no se pintan (#318).
      const subs = (c.sub ? c.sub(p) : []).filter(Boolean);
      const subHtml = subs.map(s =>
        `<div class="recorte sub-fila" style="--ancho:${c.ancho}px">${escapeHtml(s)}</div>`).join('');
      // title deja leer el valor completo sin abrir la fila (en el escritorio).
      return `<td><div class="recorte" style="--ancho:${c.ancho}px" title="${escapeHtml(texto)}">` +
        `${escapeHtml(texto)}</div>${subHtml}</td>`;
    }).join('');
    const detalle = estado.abierta === p.id ? filaDetalle(p) : '';
    return `<tr class="fila-lead" data-id="${p.id}">${celdas}<td>${celdaAcciones(p)}</td></tr>${detalle}`;
  }).join('');
  el('leads-vacio').style.display = lista.length ? 'none' : 'block';

  const sinContactar = lista.filter(p => p.estado === 'sin_contactar').length;
  el('leads-resumen').innerHTML =
    `<strong>${lista.length}</strong> prospectos · <strong>${sinContactar}</strong> sin contactar · ` +
    `toca una fila para ver el detalle`;
}

// --- Eventos de la pantalla (sin onclick inline, trampa #112) ---

function conectaEventos() {
  for (const id of ['f-evento', 'f-vendedor', 'f-tipo', 'f-area', 'f-gafete', 'f-origen', 'f-estado', 'f-pendientes']) {
    el(id).addEventListener('change', pinta);
  }
  el('f-texto').addEventListener('input', pinta);

  el('leads-cabeceras').addEventListener('click', e => {
    const th = e.target.closest('th[data-orden]');
    if (!th) return;
    const llave = th.dataset.orden;
    estado.orden = llave === estado.orden.llave
      ? { llave, asc: !estado.orden.asc }
      : { llave, asc: true };
    pinta();
  });

  el('leads-cuerpo').addEventListener('click', e => {
    const boton = e.target.closest('button[data-toque]');
    if (boton) return registrarToque(Number(boton.dataset.toque));
    // Ni la liga de WhatsApp ni ningun boton abren o cierran el detalle.
    if (e.target.closest('a, button')) return;
    const tr = e.target.closest('tr.fila-lead');
    if (!tr) return;
    const id = Number(tr.dataset.id);
    estado.abierta = estado.abierta === id ? null : id;
    pinta();
  });
}

// Contacte (spec #306): registra el Toque por la ruta que ya existe y vuelve a
// pedir la tabla, para que el estado y el ultimo contacto los siga decidiendo el
// servidor. Se repinta sin recargar, asi que los filtros y la fila abierta
// sobreviven; el error se avisa en el resumen y la tabla se queda como estaba.
async function registrarToque(id) {
  try {
    const res = await fetch(`/api/prospectos/${id}/toques`, {
      method: 'POST', headers: { Authorization: `Bearer ${estado.token}` },
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      el('leads-resumen').textContent = data.error || 'No se pudo registrar el toque';
      return;
    }
    const filas = await pideFilas();
    if (!filas) return muestraLogin();
    estado.prospectos = filas;
    pinta();
  } catch (err) {
    el('leads-resumen').textContent = 'No se pudo registrar el toque';
  }
}

// --- Arranque y sesion ---

async function api(ruta) {
  return fetch(ruta, { headers: { Authorization: `Bearer ${estado.token}` } });
}

// Devuelve las filas ya resueltas por el servidor, o null si la sesion no sirve.
async function pideFilas() {
  const res = await api('/api/prospectos/tabla');
  if (res.status === 401 || res.status === 403) return null;
  if (!res.ok) throw new Error('No se pudieron cargar los prospectos');
  // #317: entran TODOS los prospectos visibles, vengan o no de una feria. El
  // evento quedo como filtro, no como poblacion.
  return (await res.json()).map(prepara);
}

async function cargar() {
  const [filas, resCatalogos] = await Promise.all([pideFilas(), api('/api/catalogos')]);
  if (!filas) return false;
  if (resCatalogos.ok) {
    const c = await resCatalogos.json();
    estado.ligas = { catalogoUrl: c.catalogoUrl || '', sitioUrl: c.sitioUrl || '', operamUrl: c.operamUrl || '' };
  }
  estado.prospectos = filas;
  poblarFiltros();
  pinta();
  el('leads-login').style.display = 'none';
  el('leads-app').style.display = 'block';
  return true;
}

async function muestraLogin() {
  el('leads-app').style.display = 'none';
  el('leads-login').style.display = 'flex';
  const res = await fetch('/api/vendedores');
  if (!res.ok) return;
  const vendedores = await res.json();
  el('login-vendedor').innerHTML = vendedores.map(v =>
    `<option value="${v.id}">${escapeHtml(v.name)}</option>`).join('');
}

async function entrar() {
  const errEl = el('login-error');
  errEl.style.display = 'none';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ vendedorId: parseInt(el('login-vendedor').value), pin: el('login-pin').value }),
  });
  const data = await res.json();
  if (!res.ok) {
    errEl.textContent = data.error || 'PIN incorrecto';
    errEl.style.display = 'block';
    return;
  }
  estado.token = data.token;
  localStorage.setItem('token', data.token);
  localStorage.setItem('user', JSON.stringify(data.user));
  await cargar();
}

el('login-btn').addEventListener('click', entrar);
el('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
conectaEventos();

if (estado.token) {
  cargar().then(ok => { if (!ok) muestraLogin(); }).catch(() => muestraLogin());
} else {
  muestraLogin();
}
</script>
